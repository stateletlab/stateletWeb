	      <h1>Statelet - Agent Runtime Data Layer</h1>
	      <p>Statelet is an Apache 2.0 distributed database written in Rust. It gives AI agents durable memory, context versions, runtime state snapshots, an openCypher-style memory query language, DiskHNSW/SPFresh vector recall, temporal graph recall, CDC, Raft consensus, Redis compatibility, and local ONNX embeddings.</p>

	      <h2>Statelet Features</h2>
	      <ul>
	        <li><strong>Unified Runtime Data Engine</strong> - Memory, context, state snapshots, vector recall, temporal graph, and triple-store rows share one Rust engine and transaction model.</li>
	        <li><strong>Memory Query Language</strong> - Query agent memory declaratively with openCypher-style syntax, including vector search, graph expansion, and AS OF time travel.</li>
	        <li><strong>LSM-Tree Storage Engine</strong> - Concurrent skip-list MemTable, prefix-compressed SST files, bloom filters, sharded LRU block cache, leveled compaction.</li>
	        <li><strong>DiskHNSW / SPFresh Vector Search</strong> - Dense, sparse hybrid, graph-RAG, and quantized vector retrieval with local ONNX embeddings.</li>
	        <li><strong>Temporal Graph Recall</strong> - Time-aware edges, AS OF queries, supersedes chains, and graph expansion for explainable memory.</li>
	        <li><strong>Multi-Tenancy</strong> - Namespace and database scoping physically isolates keys, indexes, and graphs for every tenant or agent.</li>
	        <li><strong>CDC Feed</strong> - Durable SubscribeCommitted stream keyed on Raft log offsets for catch-up and live-tail integrations.</li>
	        <li><strong>Raft Distributed Consensus</strong> - Separate metadata and per-shard data Raft groups for production topology.</li>
	        <li><strong>Redis Protocol Compatible</strong> - RESP2-compatible TCP server. Any Redis client can connect directly.</li>
	        <li><strong>Multi-Language SDKs</strong> - Official gRPC clients for Python 3.9+, Node.js 18+, Go 1.21+, Rust 1.70+, Java 17+, and C++ 17+.</li>
	        <li><strong>Management Web Console</strong> - Namespaces, databases, graph queries, KV operations, user management, and Prometheus metrics.</li>
	      </ul>

      <h2>Architecture</h2>
	      <p>Three-tier distributed architecture: stateless Gateway (gRPC :9379, HTTP :9380, Redis :6379) routing to a Metadata Plane (Raft consensus for namespace/database registry, shard map, column families, and node registry) and Data Plane (ShardEngine per node with LSM-tree, DiskHNSW/SPFresh vector search, temporal GraphSST, and per-shard Raft).</p>

	      <h2>Performance</h2>
		      <h3>LongMemEval-S memory evaluation</h3>
	      <ul>
	        <li>Full-pipeline accuracy: 91.6% over 500 questions</li>
		        <li>Retrieval-only hit@5: 99.0%; recall@5: 93.7%; MRR: 93.8%</li>
		        <li>span_hit@5: 90.0%; span_recall@5: 78.9%; top-1 similarity: 99.4%</li>
	        <li>End-to-end overall: 458 / 500 correct; strongest categories are single-session-assistant at 98.2% and single-session-user at 97.1%</li>
	        <li>Search is pure vector plus graph retrieval; LLM extraction is ingestion-time only when enabled</li>
	      </ul>
	      <p>Open source and Apache 2.0 licensed.</p>

	      <h2>Agent Memory</h2>
	      <p>Statelet's gateway extracts structured facts from conversations, detects conflicts through vector similarity, resolves updates with temporal supersedes edges, and stores each fact with temporal metadata. Agents can recall memories with vector search, hybrid dense+sparse search, graph-RAG expansion, Personalized PageRank, and AS OF time travel.</p>

      <h2>SDKs &amp; Protocols</h2>
      <p>Official gRPC clients: Python 3.9+ (pip install statelet-sdk), Node.js 18+ (npm install statelet-sdk), Go 1.21+, Rust 1.70+, Java 17+, C++ 17+. Redis RESP2 protocol compatible — connect with redis-cli or any Redis client library.</p>

      <h2>Installation &amp; Deployment</h2>
      <p>Install the server with pip install statelet, brew install stateletlab/statelet/statelet, apt-get install statelet, dnf install statelet, a Windows MSI, or a platform tarball. Start everything with statelet-cluster start, or let the systemd unit from the Debian and RPM packages handle it. Also deployable via Docker (multi-stage build) and Kubernetes (StatefulSets with 3+ data nodes).</p>

      <p>Open source, Apache 2.0 licensed. <a href="https://github.com/stateletlab/statelet-longmemeval">View on GitHub</a>.</p>
